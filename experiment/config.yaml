defaults:
  - _self_  
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled

hydra:
  run:
    dir: ./
  output_subdir: null

seed: 0
device: cuda  # cpu
cuda_id: 0
logdir: '../log'
suffix: '_'

dataset: MNIST  # [MNIST, EMNIST, copying, CIFAR10]
save_file: null
load_file: null

optimizer: Adam  # [SGD, Adam]
lr: 5e-4  # 0.001
epochs: 20
batch_size: 100

zoo:
  num_vectors: 20  # 200  # number of perturbation vectors (ZO)
  mu: 1e-3  # smoothing hyperparameter
  diff: central  # [forward, central], should be central for H1
  max_dim: 512
  vectors: F2  # [fromI, F1, F2, H1, H2]
  pre:  # preconditioner
    update_type: whiten  # [whiten, clip_solve, solve_clip, none]
    alpha: 1e-5
    gamma: 0.01
    tau: 0.5
    Tud: 100  # Update frequency
    warm_up: 0
    initFscale: 1
    report_error: false
    empiricalFIM: false

num_features: 32
cnn:
  ch: 8
  linear_width: 64
